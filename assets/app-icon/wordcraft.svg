<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Lauh app icon — LLM-Lab brand palette (rounded blue badge + wordmark letter).
       Original artwork, MIT OR Apache-2.0. Modelled after llm-lab-annotate's
       llm_lab_logo.svg (same deep navy and blue token-dot accent). -->
  <rect width="512" height="512" rx="112" fill="#1D3A76"/>
  <!-- Brand "token" accent dot in the upper-right corner. -->
  <circle cx="400" cy="112" r="36" fill="#5B8DEF"/>
  <!-- "L" wordmark letter in the badge centre. -->
  <text x="256" y="340" text-anchor="middle"
        font-family="-apple-system,Segoe UI,sans-serif"
        font-size="256" font-weight="800" fill="#FFFFFF" letter-spacing="-6">L</text>
  <!-- "auh" trailer so the mark reads as "Lauh" at larger sizes. -->
  <text x="256" y="432" text-anchor="middle"
        font-family="-apple-system,Segoe UI,sans-serif"
        font-size="72" font-weight="700" fill="#C9D8F2" letter-spacing="4">auh</text>
</svg>
