---
metadata:
  taxonomy_name: Arabic Type-Style Taxonomy
  version: '0.4'
  created_on: '2026-05-20'
  updated_on: '2026-09-24'
  purpose: Classify Arabic type and handwriting into recognizable families and distinct subcategories, then map them to document uses and representative fonts.
  structure:
    top_level_families: 17
    subcategories: 48
    font_records: 27
    family_level: Broad type-style, calligraphic, historical, regional, or practical document family.
    subcategory_level: A visually, structurally, historically, or regionally distinct form within a family.
    coverage_rule: Document types, physical or born-digital media, platforms, and element roles describe use; they do not create new font categories.
    naming_rule: Families and subcategories use one name field. Registry references use Family > Subcategory.
  rank_scope: Expected occurrence across a mixed physical and born-digital corpus; lower ranks do not imply lower historical or artistic importance.
  classification_rule: Keep only distinctions supported by recognizable form, lineage, history, or region. Treat weight, width, medium, platform, and use as attributes.
  scope_note: Ancient North Arabian scripts such as Safaitic and Hismaic are related epigraphic systems outside the core Arabic type-style hierarchy.
  urls_verified_on: '2026-09-24'
  url_note: All populated URLs were checked. Inaccessible legacy links were replaced with current authoritative sources; unverified candidate URLs remain blank.
version_history:
- version: '0.4'
  updated_on: '2026-09-24'
  changes:
  - Consolidated overlapping subcategories while retaining the 17-family structure.
  - Clarified the family, subcategory, and coverage layers.
  - Simplified naming and refreshed verified URLs.
availability_status_values:
  open_source_downloadable: Font appears to be open-source/downloadable from a trusted official source; verify license before redistribution.
  official_free_restricted: Font is available from an official source, but reuse, redistribution, and modification terms need careful review.
  system_font_reference_only: Font may be common in real documents, but should not be redistributed.
  candidate_unverified: Font exists in the inventory, but the source/license must be verified before use beyond local testing.
