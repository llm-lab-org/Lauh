# nginx config for lauh.llm-lab.org — a static WASM site. Fronted by Traefik which already
# terminates TLS, so this listens on plain 8080 inside the container only.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # WASM MIME type (nginx:alpine's mime.types doesn't include it on all versions).
    types {
        application/wasm wasm;
        application/javascript js;
        text/css css;
        text/html html;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        font/woff2 woff2;
        font/ttf ttf;
        font/otf otf;
    }
    default_type application/octet-stream;

    gzip on;
    gzip_types application/wasm application/javascript text/css application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets (trunk filehashes everything except index.html) — cache forever.
    location ~* \.(wasm|js|css|svg|png|woff2?|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else falls back to index.html so client-side routing (`?sample`, etc.) works.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
